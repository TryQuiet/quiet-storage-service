name: Migrate Actions secrets to organization

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: Create or overwrite all listed organization secrets
        required: true
        type: boolean
        default: false

jobs:
  migrate:
    if: ${{ inputs.confirm_migration }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MIGRATION_ORGANIZATION: TryQuiet
      MIGRATION_REPOSITORIES: quiet-storage-service,quiet-storage-service-private
      MIGRATION_SOURCE_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      MIGRATION_SOURCE_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CODE_DEPLOY_APPLICATION_NAME: ${{ secrets.CODE_DEPLOY_APPLICATION_NAME }}
      CODE_DEPLOY_GROUP_NAME_DEV: ${{ secrets.CODE_DEPLOY_GROUP_NAME_DEV }}
      CODE_DEPLOY_GROUP_NAME_DEV_TEST: ${{ secrets.CODE_DEPLOY_GROUP_NAME_DEV_TEST }}
      CODE_DEPLOY_GROUP_NAME_PROD: ${{ secrets.CODE_DEPLOY_GROUP_NAME_PROD }}
      QSS_S3_CODE_DEPLOY_BUCKET: ${{ secrets.QSS_S3_CODE_DEPLOY_BUCKET }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

    steps:
      - name: Check out migration script
        uses: actions/checkout@v4

      - name: Migrate repository secrets
        env:
          GH_TOKEN: ${{ secrets.ORG_SECRETS_MIGRATION_TOKEN }}
        run: .github/scripts/migrate-actions-secrets-to-organization.sh
